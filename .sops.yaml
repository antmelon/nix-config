# SOPS configuration for The Magi
# This file contains only PUBLIC keys - safe to commit to Git

keys:
  # Personal key for editing secrets from any machine.
  # Private half: ~/.config/sops/age/personal.txt (backed up in Vaultwarden).
  # Rotated 2026-10-07 after the previous key was lost.
  - &personal age1kucs04zqnz2ch9ejk5u740xzqwla3st3mp5myd78la4g7tqjf38scn2lyq

  # Melchior - Home Server. Derived from /etc/ssh/ssh_host_ed25519_key with
  # ssh-to-age; sops-nix decrypts with it at activation.
  - &melchior age1kd4x5v53fshwaadhz48lfx36lj9xpddhr5wsg3zuglge0vm50aps9ganwp

  # Casper and Balthasar don't run sops-nix, so they have no host keys here;
  # editing from them uses the personal key.

creation_rules:
  # Casper secrets (MacBook Pro)
  - path_regex: secrets/casper\.yaml$
    key_groups:
      - age:
          - *personal

  # Melchior secrets (Home Server)
  - path_regex: secrets/melchior\.yaml$
    key_groups:
      - age:
          - *personal
          - *melchior

  # Balthasar secrets (Desktop)
  - path_regex: secrets/balthasar\.yaml$
    key_groups:
      - age:
          - *personal

  # Shared secrets (accessible from all machines)
  - path_regex: secrets/shared\.yaml$
    key_groups:
      - age:
          - *personal
          - *melchior
